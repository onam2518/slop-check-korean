<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="통합 교정 파이프라인">
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif}
    .mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,Menlo,monospace}
    .serif{font-family:"Newsreader",Georgia,serif}
  </style>

  <rect x="0" y="0" width="1200" height="430" fill="#edeef0"/>

  <text x="64" y="70" class="mono" font-size="13" letter-spacing="3" fill="#71757c">통합 교정  ·  ONE PASS</text>
  <rect x="64" y="82" width="1072" height="2" fill="#1e2024"/>

  <!-- flow row -->
  <g class="sans">
    <!-- input -->
    <text x="64" y="132" class="mono" font-size="12" letter-spacing="2" fill="#cf3b2c">입력</text>
    <text x="64" y="160" font-size="17" fill="#4a4d54">AI 초안</text>
    <text x="64" y="185" class="mono" font-size="13" fill="#cf3b2c">슬롭 90</text>

    <path d="M150 155 H200" stroke="#9a9ea5" stroke-width="2"/>
    <path d="M193 148 L202 155 L193 162" fill="none" stroke="#9a9ea5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- always-on -->
    <rect x="228" y="120" width="2" height="70" fill="#cf3b2c"/>
    <text x="248" y="132" class="mono" font-size="12" letter-spacing="2" fill="#71757c">ALWAYS-ON · 토대</text>
    <text x="248" y="163" class="serif" font-size="25" font-weight="600" fill="#1e2024">슬롭 제거 + 사실·목소리 보존</text>
    <text x="248" y="187" font-size="13.5" fill="#4a4d54">~75 패턴 카탈로그 · 무의존성 린터 · 한국어 어문 규범</text>

    <path d="M900 155 H950" stroke="#9a9ea5" stroke-width="2"/>
    <path d="M943 148 L952 155 L943 162" fill="none" stroke="#9a9ea5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- output (right-anchored, cannot overflow) -->
    <text x="1136" y="132" text-anchor="end" class="mono" font-size="12" letter-spacing="2" fill="#1e2024">출력</text>
    <text x="1136" y="160" text-anchor="end" font-size="17" fill="#1e2024">자연스러운 글</text>
    <text x="1136" y="185" text-anchor="end" class="mono" font-size="13" fill="#1e2024">0</text>
  </g>

  <rect x="64" y="228" width="1072" height="1" fill="#cdced2"/>

  <!-- 6 steps -->
  <text x="64" y="268" class="mono" font-size="12" letter-spacing="2" fill="#71757c">한국어 · 목소리 없으면 표준 페르소나로 · 6단계</text>
  <g class="sans">
    <g>
      <text x="64" y="312" class="mono" font-size="13" fill="#cf3b2c">01</text>
      <text x="64" y="340" font-size="18" font-weight="600" fill="#1e2024">보존</text>
      <rect x="206" y="296" width="1" height="52" fill="#d5d7db"/>
    </g>
    <g>
      <text x="234" y="312" class="mono" font-size="13" fill="#9a9ea5">02</text>
      <text x="234" y="340" font-size="18" font-weight="600" fill="#1e2024">어문 규범</text>
      <rect x="384" y="296" width="1" height="52" fill="#d5d7db"/>
    </g>
    <g>
      <text x="412" y="312" class="mono" font-size="13" fill="#9a9ea5">03</text>
      <text x="412" y="340" font-size="18" font-weight="600" fill="#1e2024">슬롭·번역투</text>
      <rect x="574" y="296" width="1" height="52" fill="#d5d7db"/>
    </g>
    <g>
      <text x="602" y="312" class="mono" font-size="13" fill="#9a9ea5">04</text>
      <text x="602" y="340" font-size="18" font-weight="600" fill="#1e2024">표준 용어</text>
      <rect x="752" y="296" width="1" height="52" fill="#d5d7db"/>
    </g>
    <g>
      <text x="780" y="312" class="mono" font-size="13" fill="#9a9ea5">05</text>
      <text x="780" y="340" font-size="18" font-weight="600" fill="#1e2024">구성·흐름</text>
      <rect x="930" y="296" width="1" height="52" fill="#d5d7db"/>
    </g>
    <g>
      <text x="958" y="312" class="mono" font-size="13" fill="#cf3b2c">06</text>
      <text x="958" y="340" font-size="18" font-weight="600" fill="#cf3b2c">자연스러움</text>
    </g>
  </g>

  <rect x="64" y="378" width="1072" height="1" fill="#cdced2"/>
  <text x="64" y="410" class="mono" font-size="12.5" letter-spacing="1" fill="#71757c">도구  sloplint.js · korterm.js (표준 용어) · spellcheck.js (부산대 맞춤법)</text>
</svg>
