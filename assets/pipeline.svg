  <rect x="64" y="82" width="1072" height="2" fill="#1e2024"/>

  <!-- flow row -->
  <g class="sans">
    <text x="64" y="140" class="mono" font-size="12" letter-spacing="2" fill="#cf3b2c">입력</text>
    <text x="64" y="166" font-size="17" fill="#4a4d54">AI 초안</text>
    <text x="64" y="190" class="mono" font-size="13" fill="#cf3b2c">슬롭 90</text>

    <!-- arrow -->
    <path d="M150 160 H206" stroke="#9a9ea5" stroke-width="2"/>
    <path d="M199 153 L208 160 L199 167" fill="none" stroke="#9a9ea5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

