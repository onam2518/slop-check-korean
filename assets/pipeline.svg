    <path d="M980 160 H1036" stroke="#9a9ea5" stroke-width="2"/>
    <path d="M1029 153 L1038 160 L1029 167" fill="none" stroke="#9a9ea5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="1062" y="140" class="mono" font-size="12" letter-spacing="2" fill="#1e2024">출력</text>
