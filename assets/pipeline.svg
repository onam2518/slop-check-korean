      <text x="242" y="344" font-size="18" font-weight="600" fill="#1e2024">어문 규범</text>
      <rect x="388" y="300" width="1" height="52" fill="#d5d7db"/>
    </g>
    <g>
      <text x="420" y="316" class="mono" font-size="13" fill="#9a9ea5">03</text>
      <text x="420" y="344" font-size="18" font-weight="600" fill="#1e2024">슬롭·번역투</text>
      <rect x="566" y="300" width="1" height="52" fill="#d5d7db"/>
