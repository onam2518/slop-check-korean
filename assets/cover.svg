<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="slop-check — AI 슬롭 제거 + 한국어 통합 교정">
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b4472c"/>
      <stop offset="1" stop-color="#2f7a57"/>
    </linearGradient>
    <style>
      .serif{font-family:Georgia,"Times New Roman",serif}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
    </style>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="1198" height="378" rx="20" fill="#f6f7f9" stroke="#e2e5ea" stroke-width="2"/>
  <rect x="1" y="1" width="10" height="378" rx="5" fill="#33417a"/>

  <!-- wordmark -->
  <text x="64" y="96" class="mono" font-size="15" letter-spacing="3" fill="#8b92a0">SLOP · CHECK &#8211; IM·KOREAN</text>
  <text x="60" y="168" class="serif" font-size="76" font-weight="600" fill="#1b1e26">slop-check</text>

  <!-- tagline -->
  <text x="64" y="212" class="sans" font-size="23" fill="#565d6b">AI 슬롭을 제거하고, 한국어는 어문 규범·표준 문체까지</text>
  <text x="64" y="244" class="sans" font-size="23" fill="#565d6b">한 번에 <tspan font-weight="700" fill="#1b1e26">통합 교정</tspan>합니다. 사실과 목소리는 그대로.</text>

  <!-- feature chips -->
  <g class="sans" font-size="15">
    <rect x="64" y="286" width="196" height="40" rx="20" fill="#ffffff" stroke="#d2d6dd"/>
    <text x="84" y="311" fill="#33417a" font-weight="600">10개 스킬 병합</text>
    <rect x="272" y="286" width="234" height="40" rx="20" fill="#ffffff" stroke="#d2d6dd"/>
    <text x="292" y="311" fill="#33417a" font-weight="600">국립국어원 코퍼스 실측</text>
    <rect x="518" y="286" width="232" height="40" rx="20" fill="#ffffff" stroke="#d2d6dd"/>
    <text x="538" y="311" fill="#33417a" font-weight="600">무의존성 린터 (EN·KO)</text>
  </g>

  <!-- right: score before/after -->
  <g transform="translate(812,70)">
    <rect x="0" y="0" width="326" height="240" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="163" y="40" text-anchor="middle" class="mono" font-size="13" letter-spacing="2" fill="#8b92a0">슬롭 점수 (측정값)</text>

    <!-- AS-IS -->
    <text x="70" y="132" text-anchor="middle" class="serif" font-size="72" font-weight="700" fill="#b4472c">90</text>
    <text x="70" y="160" text-anchor="middle" class="mono" font-size="12" letter-spacing="1" fill="#b4472c">AS-IS</text>

    <!-- arrow -->
    <path d="M120 112 H206" stroke="url(#rg)" stroke-width="4" stroke-linecap="round"/>
    <path d="M198 102 L212 112 L198 122" fill="none" stroke="#2f7a57" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- TO-BE -->
    <text x="256" y="132" text-anchor="middle" class="serif" font-size="72" font-weight="700" fill="#2f7a57">0</text>
    <text x="256" y="160" text-anchor="middle" class="mono" font-size="12" letter-spacing="1" fill="#2f7a57">TO-BE</text>

    <text x="163" y="210" text-anchor="middle" class="sans" font-size="14" fill="#565d6b">사실 보존 · 목소리 보존</text>
  </g>
</svg>
