<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="slop-check — AI가 쓴 티를 걷어내고 사람의 문장으로">
  <style>
    .serif{font-family:"Newsreader",Georgia,"Times New Roman",serif}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif}
    .mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,Menlo,monospace}
    .strike{text-decoration:line-through;text-decoration-color:#cf3b2c;text-decoration-thickness:2px}
  </style>

  <!-- paper -->
  <rect x="0" y="0" width="1200" height="630" fill="#edeef0"/>
  <!-- crop marks (proof motif) -->
  <g stroke="#b9bcc2" stroke-width="1.5">
    <path d="M28 46 H52 M46 28 V52"/><path d="M1172 46 H1148 M1154 28 V52"/>
    <path d="M28 584 H52 M46 602 V578"/><path d="M1172 584 H1148 M1154 602 V578"/>
  </g>

  <!-- masthead -->
  <text x="64" y="92" class="mono" font-size="14" letter-spacing="3" fill="#71757c">SLOP · CHECK  /  IM · KOREAN</text>
  <text x="1136" y="92" text-anchor="end" class="mono" font-size="14" letter-spacing="3" fill="#71757c">교정쇄  EN · KO</text>
  <rect x="64" y="104" width="1072" height="2" fill="#1e2024"/>

  <!-- title -->
  <text x="60" y="268" class="serif" font-size="130" font-weight="600" letter-spacing="-2" fill="#1e2024">slop-check</text>
  <text x="64" y="318" class="sans" font-size="25" fill="#4a4d54">AI가 쓴 티를 걷어내고, <tspan fill="#1e2024" font-weight="600">사실은 그대로</tspan> 사람의 문장으로.</text>

  <!-- proof delete mark -->
  <path d="M1050 150 C 1072 118, 1124 118, 1132 154 C 1138 184, 1102 206, 1078 194 C 1062 186, 1066 164, 1086 162 C 1110 160, 1122 184, 1110 206" fill="none" stroke="#cf3b2c" stroke-width="6" stroke-linecap="round"/>

  <!-- correction demo -->
  <g>
    <text x="64" y="452" class="mono" font-size="13" letter-spacing="2" fill="#cf3b2c">AS-IS</text>
    <text x="168" y="452" class="sans" font-size="21" fill="#4a4d54"><tspan class="strike">오늘날 빠르게 변화하는 시대에서,</tspan> 우리 팀은 생산성을 <tspan class="strike">혁신적으로 향상시키기 위해 최선을 다합니다.</tspan></text>

    <text x="64" y="498" class="mono" font-size="13" letter-spacing="2" fill="#1e2024">TO-BE</text>
    <text x="168" y="498" class="sans" font-size="21" font-weight="600" fill="#1e2024">우리 팀은 배포를 자동화했다. 릴리스 시간이 40분에서 4분으로 줄었다.</text>
  </g>

  <!-- footer -->
  <rect x="64" y="548" width="1072" height="1" fill="#cdced2"/>
  <text x="64" y="582" class="mono" font-size="12.5" letter-spacing="1.5" fill="#71757c">10 SKILLS MERGED · ZERO-DEP LINTER · 국립국어원 CORPORA</text>
  <text x="1136" y="582" text-anchor="end" class="mono" font-size="12.5" letter-spacing="1.5" fill="#71757c">MIT</text>
</svg>
